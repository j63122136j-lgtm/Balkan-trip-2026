<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <title>Balkan 2026 · Route Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIINfQ3ynsWPkssMZLZcveYSChHM9kdKp+E=" crossorigin="">
  <style>
    :root{
      color-scheme:light dark;
      --orange:#ff6a00;
      --ink:#17202a;
      --muted:#65717d;
      --panel:rgba(255,255,255,.94);
      --line:rgba(23,32,42,.12);
      --flight:#7c3aed;
      --bus:#079455;
      --train:#e32636;
      --boat:#087ea4;
      --shadow:0 10px 30px rgba(20,35,50,.16);
    }
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#d8ebf3;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",Arial,sans-serif;color:var(--ink)}
    button{font:inherit}
    #route-map{position:absolute;inset:0;background:#d8ebf3}
    .map-shell{position:relative;width:100%;height:100%;isolation:isolate}
    .map-topbar{position:absolute;z-index:700;top:14px;left:14px;right:14px;display:flex;align-items:flex-start;justify-content:space-between;gap:10px;pointer-events:none}
    .route-title,.flight-edges,.route-legend,.map-status{background:var(--panel);border:1px solid rgba(255,255,255,.84);box-shadow:var(--shadow);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
    .route-title{max-width:390px;padding:12px 15px;border-radius:15px}
    .route-title small{display:block;color:var(--orange);font-size:9px;font-weight:900;letter-spacing:.14em;text-transform:uppercase}
    .route-title h1{font-size:19px;line-height:1.1;letter-spacing:-.025em;margin:4px 0 3px}
    .route-title p{font-size:10px;color:var(--muted);margin:0}
    .flight-edges{display:flex;gap:6px;padding:6px;border-radius:999px}
    .flight-chip{display:flex;align-items:center;gap:6px;padding:7px 10px;border-radius:999px;background:#f4efff;color:#5722b7;font-size:10px;font-weight:800;white-space:nowrap}
    .flight-chip i{width:7px;height:7px;border-radius:50%;background:var(--flight);box-shadow:0 0 0 3px rgba(124,58,237,.14)}
    .route-legend{position:absolute;z-index:700;left:14px;bottom:14px;display:flex;gap:11px;padding:9px 12px;border-radius:13px;pointer-events:none}
    .legend-item{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:800;white-space:nowrap}
    .legend-item i{display:block;width:23px;border-top:3px solid var(--mode);border-radius:99px}
    .legend-item.flight i,.legend-item.boat i{border-top-style:dashed}
    .map-status{position:absolute;z-index:700;right:14px;bottom:14px;max-width:min(420px,48vw);padding:10px 13px;border-radius:13px;font-size:10px;line-height:1.45;color:var(--muted);pointer-events:none}
    .map-status b{display:block;color:var(--ink);font-size:11px;margin-bottom:1px}
    .leaflet-control-zoom{border:0!important;box-shadow:var(--shadow)!important;margin-top:86px!important;margin-left:14px!important}
    .leaflet-control-zoom a{border:0!important;color:var(--ink)!important;background:var(--panel)!important}
    .leaflet-control-attribution{font-size:8px!important;background:rgba(255,255,255,.78)!important}
    .leaflet-popup-content-wrapper{border-radius:15px;box-shadow:var(--shadow);padding:0}
    .leaflet-popup-content{margin:0;width:230px!important}
    .stop-popup{padding:14px 15px}
    .stop-popup small{display:block;color:var(--orange);font-size:9px;font-weight:900;letter-spacing:.09em;text-transform:uppercase}
    .stop-popup b{display:block;font-size:16px;margin:3px 0 5px}
    .stop-popup p{margin:0;color:var(--muted);font-size:11px;line-height:1.5}
    .day-marker{position:relative;display:grid;place-items:center;width:31px;height:31px;border:3px solid white;border-radius:50% 50% 50% 8px;background:var(--orange);color:white;font-size:10px;font-weight:900;box-shadow:0 3px 10px rgba(0,0,0,.28);transform:rotate(-45deg)}
    .day-marker span{transform:rotate(45deg)}
    .minor-marker{width:13px;height:13px;border:3px solid white;border-radius:50%;background:var(--orange);box-shadow:0 2px 7px rgba(0,0,0,.3)}
    .route-label{padding:4px 7px;border:1px solid rgba(255,255,255,.9);border-radius:7px;background:rgba(255,255,255,.92);box-shadow:0 2px 8px rgba(0,0,0,.13);color:#24313c;font-size:9px;font-weight:900;white-space:nowrap}
    .leaflet-tooltip-top:before{border-top-color:rgba(255,255,255,.92)}
    .leaflet-tooltip-bottom:before{border-bottom-color:rgba(255,255,255,.92)}
    .embed .route-title{padding:9px 12px}
    .embed .route-title h1{font-size:16px}
    .embed .route-title p{display:none}
    .embed .map-status{display:none}
    .embed .leaflet-control-zoom{margin-top:70px!important}
    @media(prefers-color-scheme:dark){
      :root{--ink:#f5f5f7;--muted:#b1b7bd;--panel:rgba(31,33,36,.93);--line:rgba(255,255,255,.12);--shadow:0 12px 34px rgba(0,0,0,.38)}
      #route-map .leaflet-tile-pane{filter:brightness(.72) saturate(.88) contrast(1.08)}
      .flight-chip{background:#372653;color:#cdb8ff}
      .route-label{background:rgba(31,33,36,.94);color:#f5f5f7;border-color:rgba(255,255,255,.18)}
      .leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#242629;color:#f5f5f7}
      .leaflet-control-attribution{background:rgba(30,32,35,.82)!important;color:#ddd!important}
    }
    @media(max-width:700px){
      .map-topbar{top:8px;left:8px;right:8px}
      .route-title{max-width:230px;padding:9px 11px}
      .route-title h1{font-size:15px}
      .route-title p{display:none}
      .flight-edges{display:none}
      .route-legend{left:8px;right:8px;bottom:8px;justify-content:center;gap:9px;padding:8px}
      .legend-item{font-size:9px}.legend-item i{width:18px}
      .map-status{display:none}
      .leaflet-control-zoom{margin-top:67px!important;margin-left:8px!important}
      .leaflet-control-attribution{max-width:180px;white-space:normal;line-height:1.1}
    }
  </style>
</head>
<body>
  <main class="map-shell" aria-label="Balkan 2026 互動式路線地圖">
    <div id="route-map"></div>
    <div class="map-topbar">
      <div class="route-title">
        <small>Route overview · 2026</small>
        <h1>Slovenia → Croatia → Bosnia</h1>
        <p>拖曳、縮放或點選 Day 標記查看當日移動。</p>
      </div>
      <div class="flight-edges" aria-label="長程航班銜接">
        <span class="flight-chip"><i></i>D4 Istanbul → Ljubljana</span>
        <span class="flight-chip"><i></i>D17 Dubrovnik → Geneva</span>
      </div>
    </div>
    <div class="route-legend" aria-label="交通方式圖例">
      <span class="legend-item flight" style="--mode:var(--flight)"><i></i>飛機</span>
      <span class="legend-item" style="--mode:var(--bus)"><i></i>巴士</span>
      <span class="legend-item" style="--mode:var(--train)"><i></i>火車</span>
      <span class="legend-item boat" style="--mode:var(--boat)"><i></i>船程</span>
    </div>
    <div class="map-status" id="route-status" aria-live="polite">
      <b>主要陸路</b>Ljubljana → Zagreb → Split → Mostar → Sarajevo → Dubrovnik
    </div>
  </main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script>
    if(new URLSearchParams(location.search).has('embed')) document.documentElement.classList.add('embed');

    const colors={flight:'#7c3aed',bus:'#079455',train:'#e32636',boat:'#087ea4'};
    const map=L.map('route-map',{zoomControl:true,attributionControl:true,minZoom:5,maxZoom:13,zoomSnap:.25});
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{
      maxZoom:19,
      attribution:'&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'
    }).addTo(map);

    const places={
      Ljubljana:[46.0569,14.5058],Bled:[46.3692,14.1136],Vintgar:[46.3924,14.0837],
      Postojna:[45.7749,14.2037],Predjama:[45.8159,14.1272],Zagreb:[45.8150,15.9819],
      Split:[43.5081,16.4402],Vis:[43.0619,16.1864],Hvar:[43.1729,16.4424],
      Mostar:[43.3438,17.8078],Blagaj:[43.2565,17.8886],Sarajevo:[43.8563,18.4131],
      Dubrovnik:[42.6507,18.0944]
    };

    const stops=[
      {name:'Ljubljana',day:'D4',date:'09/17',text:'抵達後入住 Gosposvetska cesta 4；連住三晚。'},
      {name:'Postojna',day:'D5',date:'09/18',text:'Postojna Cave＋Predjama Castle 自由行，當晚返回 Ljubljana。'},
      {name:'Bled',day:'D6',date:'09/19',text:'Vintgar Gorge＋Lake Bled，早去晚回。'},
      {name:'Zagreb',day:'D7',date:'09/20',text:'傍晚由 Ljubljana 搭火車抵達，連住兩晚。'},
      {name:'Split',day:'D9',date:'09/22',text:'Zagreb 搭直達巴士南下；Split 連住兩晚。'},
      {name:'Mostar',day:'D11',date:'09/24',text:'17:30 由 Split 搭跨境巴士，入住 Adema Buća 23 B&B。'},
      {name:'Sarajevo',day:'D13',date:'09/26',text:'Mostar 搭晚間景觀火車，連住兩晚。'},
      {name:'Dubrovnik',day:'D15',date:'09/28',text:'Sarajevo 搭跨境巴士抵達；09/30 飛 Geneva。'}
    ];

    const routes=[
      {mode:'bus',label:'D5 · Postojna＋Predjama 當日來回',coords:[places.Ljubljana,places.Postojna,places.Predjama,places.Postojna,places.Ljubljana]},
      {mode:'bus',label:'D6 · Bled＋Vintgar 當日來回',coords:[places.Ljubljana,places.Bled,places.Vintgar,places.Bled,places.Ljubljana]},
      {mode:'train',label:'D7 · Ljubljana → Zagreb 火車',coords:[places.Ljubljana,[45.92,15.15],places.Zagreb]},
      {mode:'bus',label:'D9 · Zagreb → Split 直達巴士',coords:[places.Zagreb,[45.49,15.55],[44.55,15.37],[43.73,15.90],places.Split]},
      {mode:'boat',label:'D10 · Split → Vis → Hvar → Split',coords:[places.Split,places.Vis,places.Hvar,places.Split]},
      {mode:'bus',label:'D11 · Split → Mostar 跨境巴士',coords:[places.Split,[43.45,17.22],places.Mostar]},
      {mode:'bus',label:'D12 · Mostar ↔ Blagaj',coords:[places.Mostar,places.Blagaj,places.Mostar]},
      {mode:'train',label:'D13 · Mostar → Sarajevo 景觀火車',coords:[places.Mostar,[43.66,17.76],[43.65,17.96],places.Sarajevo]},
      {mode:'bus',label:'D15 · Sarajevo → Dubrovnik 跨境巴士',coords:[places.Sarajevo,places.Mostar,[43.05,17.65],places.Dubrovnik]}
    ];

    const status=document.getElementById('route-status');
    routes.forEach(route=>{
      const line=L.polyline(route.coords,{color:colors[route.mode],weight:5,opacity:.92,dashArray:route.mode==='boat'?'9 8':null,lineCap:'round',lineJoin:'round'}).addTo(map);
      line.on('mouseover',()=>{status.innerHTML=`<b>${route.label}</b>${route.mode==='train'?'火車':route.mode==='boat'?'船程':'巴士'}路線；實際道路與班次以出發前查詢為準。`;});
      line.on('mouseout',()=>{status.innerHTML='<b>主要陸路</b>Ljubljana → Zagreb → Split → Mostar → Sarajevo → Dubrovnik';});
      line.bindTooltip(route.label,{sticky:true,className:'route-label'});
    });

    const flightEdges=[
      {label:'D4 · Istanbul → Ljubljana',coords:[[46.24,18.72],places.Ljubljana]},
      {label:'D17 · Dubrovnik → Geneva',coords:[places.Dubrovnik,[43.05,13.82]]}
    ];
    flightEdges.forEach(route=>{
      const line=L.polyline(route.coords,{color:colors.flight,weight:4,opacity:.9,dashArray:'10 9',lineCap:'round'}).addTo(map);
      line.bindTooltip(route.label,{sticky:true,className:'route-label'});
      line.on('mouseover',()=>{status.innerHTML=`<b>${route.label}</b>長程航班只顯示進出地圖範圍的方向。`;});
      line.on('mouseout',()=>{status.innerHTML='<b>主要陸路</b>Ljubljana → Zagreb → Split → Mostar → Sarajevo → Dubrovnik';});
    });

    const dayIcon=day=>L.divIcon({className:'',html:`<div class="day-marker"><span>${day}</span></div>`,iconSize:[31,31],iconAnchor:[15,29],popupAnchor:[0,-27]});
    stops.forEach(stop=>{
      L.marker(places[stop.name],{icon:dayIcon(stop.day),title:`${stop.day} ${stop.name}`}).addTo(map)
        .bindTooltip(stop.name,{direction:'top',offset:[0,-23],className:'route-label',permanent:false})
        .bindPopup(`<div class="stop-popup"><small>${stop.day} · ${stop.date}</small><b>${stop.name}</b><p>${stop.text}</p></div>`);
    });

    ['Vintgar','Predjama','Vis','Hvar','Blagaj'].forEach(name=>{
      L.marker(places[name],{icon:L.divIcon({className:'',html:'<div class="minor-marker"></div>',iconSize:[13,13],iconAnchor:[6,6]})}).addTo(map)
        .bindTooltip(name,{direction:'top',offset:[0,-5],className:'route-label'});
    });

    const coreBounds=L.latLngBounds([42.46,13.75],[46.58,18.75]);
    map.fitBounds(coreBounds,{padding:[22,22]});
    map.on('zoomend',()=>{if(map.getZoom()<5.25)map.setZoom(5.25)});
    setTimeout(()=>map.invalidateSize(),120);
  </script>
</body>
</html>
